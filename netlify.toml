[build]
  command = "npm run build"
  # Migrations in netlify/database/migrations are applied by Netlify Database
  # right before each deploy is published.
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
